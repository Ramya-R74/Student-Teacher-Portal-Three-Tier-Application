version: '3.9'

services:
  db:
    container_name: mysql-container
    image: mysql:8.0.40-oraclelinux9
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: backend
    build:
      context: backend/
    image: backend-image
    restart: always
    ports:
      - "${BACKEND_PORT}:3500"
    environment:
      host: ${DB_HOST}
      user: ${BACKEND_USER}
      password: ${BACKEND_PASSWORD}
      database: ${BACKEND_DATABASE}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: frontend
    build:
      context: frontend/
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    image: frontend-image
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}

volumes:
  mysql-data: